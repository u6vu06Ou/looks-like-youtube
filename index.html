<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:transparent; cursor:none; }
  #stage { position:absolute; left:0; bottom:0; width:1920px; height:1080px;
           transform-origin: 0 100%; font-family: "Roboto","Noto Sans TC","Microsoft JhengHei",sans-serif; }

  /* ── 頂部 extension 標記 ── */
  .chip { position:absolute; border-radius:2px; font-size:14px; line-height:24px; padding:0 8px;
          color:#fff; white-space:nowrap; }
  #ver { left:14px; top:14px; background:rgba(40,40,40,.82); }
  #newver { right:76px; top:14px; background:#8a5a00; }
  #sub { right:14px; top:14px; background:rgba(40,40,40,.82); }

  /* ── 標題 ── */
  #title { position:absolute; left:152px; right:212px; top:9px; font-size:23px; font-weight:700;
           color:#fff; text-shadow:0 0 6px rgba(0,0,0,.9), 0 2px 3px rgba(0,0,0,.8);
           white-space:nowrap; overflow:hidden; }
  /* 標題底下的淡漸層，讓白字在亮背景也讀得到 */
  #topscrim { position:absolute; left:0; right:0; top:0; height:56px;
              background:linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.22) 55%, transparent); }

  /* ── 中央按讚／訂閱／鈴鐺 ── */
  #center { position:absolute; left:0; right:0; top:472px; height:74px;
            display:flex; align-items:center; justify-content:center; gap:22px; }
  .bubble { width:68px; height:68px; border-radius:50%; display:flex; align-items:center; justify-content:center;
            background:rgba(238,238,238,.94); }
  .bubble.like { background:#c00; border:3px solid #3d6bd6; }
  #subscribed { background:rgba(238,238,238,.96); color:#0f0f0f; font-size:34px; font-weight:700;
                letter-spacing:.5px; padding:13px 30px; border-radius:8px; }
  #tooltip { position:absolute; right:18px; top:52px; background:#c00; color:#fff; font-size:15px;
             padding:4px 10px; border-radius:3px; }
  #tooltip::before { content:"PETER"; position:absolute; left:0; right:0; top:-17px; text-align:center;
             color:#c00; font-size:11px; font-weight:700; }
  svg { display:block; }

  /* ── 假游標 ── */
  #cursor { position:absolute; left:1186px; top:600px; width:34px; height:34px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  /* ── 字幕 ── */
  #caption { position:absolute; left:0; right:0; top:846px; text-align:center; color:#fff;
             font-size:42px; font-weight:500; letter-spacing:1px;
             text-shadow:0 0 8px #000, 0 0 4px #000, 0 2px 4px #000; }

  /* ── 底部控制列（透明細條，不遮快捷鍵） ── */
  #bar { position:absolute; left:0; right:0; bottom:var(--bar-bottom,6px); height:46px; }
  #track { position:absolute; left:0; right:0; top:0; height:4px; background:rgba(255,255,255,.38); }
  #fill { position:absolute; left:0; top:0; height:4px; background:#f00; width:1410px; }
  #knob { position:absolute; left:1405px; top:-5px; width:14px; height:14px; border-radius:50%; background:#f00; }

  #row { position:absolute; left:0; right:0; bottom:1px; height:34px; display:flex; align-items:center;
         color:#fff; }
  .ic { width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
        filter:drop-shadow(0 1px 2px rgba(0,0,0,.9)); }
  #row .left { display:flex; align-items:center; gap:0; margin-left:12px; }
  #live { background:rgba(20,20,20,.88); border-radius:92px; font-size:13px; padding:4px 12px;
          margin-left:4px; white-space:nowrap; }
  #chev { position:absolute; left:954px; bottom:-10px; }
  #row .right { display:flex; align-items:center; gap:9px; margin-left:auto; margin-right:14px; }
  #toggle { width:44px; height:24px; border-radius:99px; background:#e8e8e8; display:flex;
            align-items:center; padding:3px; }
  #toggle i { width:18px; height:18px; border-radius:50%; background:#0b57d0; margin-left:auto; }

  .hidden { display:none !important; }
  /* 視窗常駐，靠這個開關顯示整層內容（避免反覆 show/hide 造成透明視窗變黑） */
  body:not(.armed):not(.calibrating) #stage { visibility:hidden; }
  /* 直播版型：保留標題與底部細條，不顯示字幕與中央訂閱 */
  #caption, #center { display:none; }

  /* ── 校準提示 ── */
  #calhint { position:absolute; left:50%; top:42%; transform:translateX(-50%);
             background:rgba(15,15,15,.94); border:1px solid rgba(255,255,255,.22);
             border-radius:10px; padding:22px 34px; color:#fff; text-align:center;
             font-size:20px; line-height:1.7; }
  #calhint b { font-size:28px; color:#ff5252; }
  #calhint small { display:block; margin-top:10px; color:#9a9a9a; font-size:15px; }
</style>
</head>
<body>
<div id="stage">
  <div id="topscrim"></div>
  <div class="chip" id="ver">yitsub v0.1.3</div>
  <div class="chip" id="newver">有新版 v0.1.4</div>
  <div class="chip" id="sub">譯：關</div>

  <div id="title"></div>

  <div id="center">
    <div class="bubble like">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M3 10h3v11H3zM9 21h8.5a2 2 0 0 0 2-1.7l1.4-8A1.6 1.6 0 0 0 19.3 9.4H14l.9-4.3A1.9 1.9 0 0 0 13 3l-4 7z"/></svg>
    </div>
    <div id="subscribed">SUBSCRIBED</div>
    <div class="bubble bell">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="#8a8a8a"><path d="M12 3a5 5 0 0 0-5 5v4.5L5.5 16h13L17 12.5V8a5 5 0 0 0-5-5zm0 17a2.5 2.5 0 0 0 2.4-1.8H9.6A2.5 2.5 0 0 0 12 20z"/></svg>
    </div>
  </div>
  <div id="tooltip">訂閱</div>

  <svg id="cursor" class="hidden" viewBox="0 0 24 24"><path d="M4 2l15 10.5-6.4 1.2L16 21l-2.6 1.2-3.3-7.3L5.6 19z" fill="#fff" stroke="#000" stroke-width="1.4"/></svg>

  <div id="caption">其中有幾項</div>

  <div id="bar">
    <div id="track"><div id="fill"></div><div id="knob"></div></div>
    <div id="row">
      <div class="left">
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M7 4l13 8-13 8z"/></svg></div>
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M4 9h3l4-3v12l-4-3H4zm11 1a3 3 0 0 1 0 4zm2.5-3.5a6.5 6.5 0 0 1 0 9l-1.2-1.3a4.8 4.8 0 0 0 0-6.4z"/></svg></div>
        <div id="live">● <span id="label"></span></div>
      </div>
      <div class="ic" id="chev"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M6 15l6-6 6 6z"/></svg></div>
      <div class="right">
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M3 10h3v11H3zM9 21h8.5a2 2 0 0 0 2-1.7l1.4-8A1.6 1.6 0 0 0 19.3 9.4H14l.9-4.3A1.9 1.9 0 0 0 13 3l-4 7z"/></svg></div>
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 21V10l4-7 1.6 1.3a2 2 0 0 1 .7 1.9L14.4 10H20l.8 5.6A2 2 0 0 1 18.8 18H12"/></svg></div>
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M20 4H8v13h12z"/><path d="M4 8v12h12"/></svg></div>
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 20L20 4"/><path d="M11 4h9v9"/></svg></div>
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></div>
        <div id="toggle"><i></i></div>
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.8 3.5c0-.6-.06-1.2-.17-1.8l2-1.5-2-3.4-2.3.95a8.9 8.9 0 0 0-3.1-1.8L14.8 2h-4l-.4 2.45a8.9 8.9 0 0 0-3.1 1.8L5 5.3l-2 3.4 2 1.5a9.4 9.4 0 0 0 0 3.6l-2 1.5 2 3.4 2.3-.95a8.9 8.9 0 0 0 3.1 1.8L10.8 22h4l.4-2.45a8.9 8.9 0 0 0 3.1-1.8l2.3.95 2-3.4-2-1.5c.1-.6.17-1.2.17-1.8z"/></svg></div>
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" fill="#fff" stroke="none"/></svg></div>
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h4M7 14h4"/></svg></div>
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></div>
      </div>
    </div>
  </div>

  <div id="calhint" class="hidden">
    <b>↑ / ↓</b> 調整控制列位置
    <small>Enter 存檔　·　Esc 取消</small>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');
  const root = document.documentElement;

  // 一律以 1920x1080 為設計座標等比縮放；短邊對齊，底部控制列永遠貼齊畫面下緣
  function fit() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `scale(${s})`;
  }
  window.addEventListener('resize', fit);
  fit();

  let cur = 1410;
  const fill = document.getElementById('fill');
  const knob = document.getElementById('knob');

  function draw() {
    fill.style.width = cur + 'px';
    knob.style.left = (cur - 6) + 'px';
  }
  draw();
  // 直播：進度條停在接近直播邊緣，極慢往前爬
  setInterval(() => { cur = 1410 + ((cur - 1400) % 120) + 1; draw(); }, 2000);

  (async () => {
    const cfg = await window.fake.config();
    document.getElementById('title').textContent = cfg.title;
    document.getElementById('label').textContent = cfg.label;
    if (!cfg.showTitle) document.getElementById('title').classList.add('hidden');
    // 第一次啟動、設定還在預設值時，直接把校準叫出來
    const st = await window.fake.state();
    if (cfg.barBottom === 6 && !st.calibrating) {
      // 由主程序決定是否自動開；這裡只負責套用值
    }
    root.style.setProperty('--bar-bottom', cfg.barBottom + 'px');
  })();

  window.fake.onArmed((on) => {
    document.body.classList.toggle('armed', !!on);
    if (!on) document.body.classList.remove('calibrating');
  });

  window.fake.onCalibrate(({ on, barBottom }) => {
    root.style.setProperty('--bar-bottom', barBottom + 'px');
    document.body.classList.toggle('calibrating', !!on);
    document.getElementById('calhint').classList.toggle('hidden', !on);
    document.getElementById('bar').style.outline = on ? '1px solid #ff5252' : 'none';
  });
</script>
</body>
</html>
